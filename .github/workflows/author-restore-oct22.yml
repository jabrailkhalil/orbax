name: Author mixed restore October 22
on:
  push:
    branches: [validation/mixed-single-replica-oct22]
permissions:
  contents: read
jobs:
  distributed:
    name: Distributed ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source: [head, base]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select pinned source and verify identity
        run: |
          git diff --exit-code e8d1ba461ed8db51b2b6cfe3c2b97f4ac8d14acd -- checkpoint
          if [ '${{ matrix.source }}' = base ]; then
            git restore --source=df08034789d2cfeb24a4bfbe0df9c1eb98becf28 -- checkpoint
          fi
          git diff --exit-code ${{ matrix.source == 'base' && 'df08034789d2cfeb24a4bfbe0df9c1eb98becf28' || 'e8d1ba461ed8db51b2b6cfe3c2b97f4ac8d14acd' }} -- checkpoint
      - name: Install exact JAX runtime
        run: pip install -e ./checkpoint jax==0.11.2 jaxlib==0.11.2 pytest pytest-xdist mock chex flax portpicker tensorboard
      - name: Mixed regressions on head
        if: matrix.source == 'head'
        working-directory: checkpoint
        env:
          TEST_LOGDIR: mixed-regression-logs
        run: python ../validation/run_distributed_tests.py orbax/checkpoint/_src/serialization/type_handlers_test.py -k test_mixed_restore_args
      - name: Full two-rank type handler suite
        working-directory: checkpoint
        env:
          TEST_LOGDIR: type-handler-logs
        run: python ../validation/run_distributed_tests.py orbax/checkpoint/_src/serialization/type_handlers_test.py
      - name: Full two-rank checkpoint handler integration
        working-directory: checkpoint
        env:
          TEST_LOGDIR: checkpoint-handler-logs
        run: python ../validation/run_distributed_tests.py orbax/checkpoint/_src/handlers/pytree_checkpoint_handler_test.py orbax/checkpoint/_src/handlers/array_checkpoint_handler_test.py orbax/checkpoint/_src/handlers/standard_checkpoint_handler_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restore-${{ matrix.source }}
          path: checkpoint/*-logs
  checkpoint-suite:
    name: Complete single-host checkpoint suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git diff --exit-code e8d1ba461ed8db51b2b6cfe3c2b97f4ac8d14acd -- checkpoint
      - name: Install suite dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e './checkpoint[testing,tiering_service]' portpicker tensorboard jax==0.11.2 jaxlib==0.11.2
          cd checkpoint
          python -m grpc_tools.protoc -I=. --python_out=. --grpc_python_out=. $(find orbax/checkpoint/ -name '*.proto')
      - name: Unmodified upstream single-host selection
        run: python validation/run_checkpoint_suite.py
